<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AMANAH</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      margin: 0;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 100px auto;
      padding: 30px;
    }

    h1 {
      font-size: 55px;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 20px;
      color: #555;
      margin-bottom: 40px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 20px;
      font-size: 17px;
      border-radius: 15px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      padding: 15px 35px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      display: none;
      background: white;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AMANAH</h1>

    <div class="subtitle">
      تتبّع المعلومة إلى مصدرها
    </div>

    <textarea
      id="claim"
      placeholder="ألصق هنا حديثًا، اقتباسًا، أو ادعاءً إسلاميًا..."
    ></textarea>

    <br>

    <button onclick="verifyClaim()">
      تحقق مع أمانة
    </button>

    <div id="result"></div>

  </div>

<script>
  const database = [
    {
      text: "إنما الأعمال بالنيات",
      source: "صحيح البخاري",
      reference: "حديث رقم 1"
    },
    {
      text: "من كان يؤمن بالله واليوم الآخر فليقل خيرا أو ليصمت",
      source: "صحيح البخاري وصحيح مسلم",
      reference: "حديث مشهور في الصحيحين"
    },
    {
      text: "الدين النصيحة",
      source: "صحيح مسلم",
      reference: "حديث معروف"
    }
  ];

  function normalizeText(text) {
    return text
      .replace(/[ًٌٍَُِّْـ]/g, "")
      .replace(/[أإآ]/g, "ا")
      .replace(/ة/g, "ه")
      .replace(/\s+/g, " ")
      .trim();
  }

  function verifyClaim() {
    const claim = document.getElementById("claim").value;
    const result = document.getElementById("result");

    if (!claim.trim()) {
      alert("أدخل النص أولاً");
      return;
    }

    const normalizedClaim = normalizeText(claim);

    const match = database.find(item =>
      normalizedClaim.includes(normalizeText(item.text)) ||
      normalizeText(item.text).includes(normalizedClaim)
    );

    result.style.display = "block";

    if (match) {
      result.innerHTML = `
        <h2>AMANAH Report</h2>

        <p>✅ تم العثور على تطابق</p>

        <p><strong>النص:</strong><br>${match.text}</p>

        <p><strong>المصدر:</strong><br>${match.source}</p>

        <p><strong>المرجع:</strong><br>${match.reference}</p>

        <p style="font-size:14px;color:#666;">
          هذه نتيجة من قاعدة AMANAH التجريبية الحالية.
        </p>
      `;
    } else {
      result.innerHTML = `
        <h2>AMANAH Report</h2>

        <p>⚠️ لم نعثر على هذا النص في قاعدة البيانات الحالية.</p>

        <p style="font-size:14px;color:#666;">
          هذا لا يعني أن النص غير صحيح؛ فقط لم يتم العثور عليه ضمن المصادر المضافة حاليًا.
        </p>
      `;
    }
  }
</script>
  

</body>
</html>
